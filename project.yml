name: MacTools
options:
  bundleIdPrefix: com.micktaiwan
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  MacTools:
    type: application
    platform: macOS
    sources:
      - MacTools
    info:
      path: MacTools/Info.plist
      properties:
        LSUIElement: true
        NSCalendarsUsageDescription: "Mac Tools needs access to your calendars to display upcoming events in the menu bar."
    entitlements:
      path: MacTools/MacTools.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        # Signed with a real identity, not ad hoc: macOS keys the Accessibility
        # grant to the code signature, and an ad-hoc signature changes on every
        # rebuild, which would mean re-ticking the checkbox in System Settings
        # after each build.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ZMKDR6H89Y
        PRODUCT_BUNDLE_IDENTIFIER: com.micktaiwan.MacTools
